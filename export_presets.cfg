[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/*, godot-mcp-pro-v1.15.1/*, *.html, *.md, *.bak"
export_path="docs/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; Threads OFF. Godot's threaded web export needs SharedArrayBuffer, which
; requires COOP/COEP response headers — GitHub Pages cannot set those, so a
; threaded build would fail to boot there.
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
; The custom shell — the wordmark, the real percentage bar, the keybind table,
; the disclaimers and the one click that resolves the audio unlock and the first
; pointer lock together. EDIT web/shell.html, never docs/index.html: that one is
; this build's output. `*.html` stays in the exclude filter above and the shell
; is unaffected by it — the exporter reads it from the project directory at
; export time rather than from the packed resources.
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
; PWA ON, and the reason is a measurement rather than a feature checkbox: GitHub
; Pages serves this payload with `Cache-Control: max-age=600`, so a visitor who
; comes back eleven minutes later revalidates and re-downloads all 40 MB of
; index.wasm. The service worker holds the whole payload in CacheStorage and
; serves it cache-first, which makes a return visit free.
;
; THE STALE-WORKER TRAP IS REAL AND IS HANDLED BY THE ENGINE, but only because
; the cache key is per-export: godot.service.worker.js declares
; `CACHE_VERSION = '___GODOT_VERSION___'` and the exporter substitutes a value
; that changes on every export, so a rebuild lands in a NEW cache, the `install`
; event fires, and `activate` deletes every older `kriegsnacht-sw-cache-*`. A
; hand-written worker with a constant version is the classic "my fix did not
; deploy"; this one is not that. Verified by exporting twice and diffing the
; emitted CACHE_VERSION — see this milestone's report.
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
; The ash the game itself clears to (project.godot's default_clear_color), so an
; installed PWA's splash and title bar are not a black rectangle around a nearly
; black game.
progressive_web_app/background_color=Color(0.043, 0.047, 0.039, 1)

[preset.1]

name="WebPerf"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
; Enables scripts/perf_probe.gd. Never set on the shipped "Web" preset.
custom_features="perfprobe"
export_filter="all_resources"
include_filter=""
exclude_filter="addons/*, godot-mcp-pro-v1.15.1/*, *.html, *.md, *.bak"
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
; DELIBERATELY the stock shell, and deliberately no service worker. The perf
; harness is driven by a script that expects the canvas to be live on load;
; web/shell.html holds it behind a click by design, and a cache-first worker
; would serve a previous run's build to the next measurement.
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
